<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>老婆仔 生日快樂</title>
<meta name="description" content="身體健康，屋企人錫我">
<meta property="og:type" content="website">
<meta property="og:title" content="老婆仔 生日快樂">
<meta property="og:description" content="身體健康，屋企人錫我">
<meta property="og:image" content="https://noctis-owl.github.io/jennie-birthday-card/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night-1:#05070c;
    --night-2:#0d1220;
    --night-3:#161d30;
    --gold-hi:#fff6d8;
    --gold-1:#f4df9a;
    --gold-2:#e9c766;
    --gold-3:#c99b3c;
    --gold-4:#8a6a20;
    --ink:#f6ecd4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--night-1);
    color:var(--ink);
    font-family:"Noto Serif TC",serif;
    overflow-x:hidden;
  }
  .stage{position:relative;isolation:isolate}
  .hero{
    position:relative;z-index:3;
    min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:clamp(20px,4vw,40px) 16px clamp(16px,3vw,28px);
  }
  #sky{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
  #fx{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:5}

  /* warm horizon bloom + vignette, kept off the palette of blue-purple */
  .veil{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(120% 80% at 50% 118%, rgba(201,155,60,.30), transparent 62%),
      radial-gradient(80% 55% at 18% 12%, rgba(233,199,102,.13), transparent 70%),
      radial-gradient(70% 50% at 86% 8%, rgba(244,223,154,.10), transparent 72%),
      radial-gradient(130% 100% at 50% 45%, transparent 38%, rgba(3,4,8,.72) 100%);
  }
  /* fine gold grain */
  .grain{
    position:fixed;inset:-40%;z-index:2;pointer-events:none;opacity:.055;
    background-image:radial-gradient(rgba(255,246,216,.55) .6px, transparent .6px);
    background-size:7px 7px;
    animation:drift 90s linear infinite;
  }
  @keyframes drift{to{transform:translate3d(-7px,7px,0)}}

  /* ---------- chip bar ---------- */
  .chips{
    position:fixed;top:0;right:0;z-index:6;
    display:flex;gap:8px;padding:14px 16px;
    animation:fadeDown .9s ease .4s both;
  }
  @keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 14px;min-height:36px;
    font-family:"Noto Serif TC",serif;font-size:12.5px;letter-spacing:.14em;
    color:rgba(244,223,154,.92);
    background:rgba(233,199,102,.07);
    border:1px solid rgba(233,199,102,.30);
    border-radius:999px;cursor:pointer;
    transition:background .25s,border-color .25s,transform .15s;
  }
  .chip:hover{background:rgba(233,199,102,.15);border-color:rgba(244,223,154,.55)}
  .chip:active{transform:scale(.97)}
  .chip[aria-pressed="false"]{opacity:.5}
  .chip[aria-pressed="true"]{background:rgba(233,199,102,.16)}

  /* ---------- hero card ---------- */
  .card{
    position:relative;z-index:3;
    width:min(92vw,720px);
    padding:clamp(30px,7vw,64px) clamp(20px,6vw,56px) clamp(26px,6vw,52px);
    text-align:center;
    border:1px solid rgba(233,199,102,.34);
    border-radius:22px;
    background:
      linear-gradient(180deg, rgba(10,14,24,.40), rgba(5,7,12,.66));
    backdrop-filter:blur(3px) saturate(115%);
    -webkit-backdrop-filter:blur(3px) saturate(115%);
    box-shadow:
      0 0 0 1px rgba(5,7,12,.5),
      0 26px 70px -28px rgba(0,0,0,.9),
      inset 0 1px 0 rgba(255,246,216,.12);
    animation:rise 1.25s cubic-bezier(.2,.8,.25,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}

  .corner{position:absolute;width:22px;height:22px;border:1px solid rgba(244,223,154,.5)}
  .corner.tl{top:11px;left:11px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
  .corner.tr{top:11px;right:11px;border-left:0;border-bottom:0;border-radius:0 6px 0 0}
  .corner.bl{bottom:11px;left:11px;border-right:0;border-top:0;border-radius:0 0 0 6px}
  .corner.br{bottom:11px;right:11px;border-left:0;border-top:0;border-radius:0 0 6px 0}

  .eyebrow{
    margin:0 0 14px;
    font-family:"Noto Serif TC",serif;
    font-size:clamp(13px,2.8vw,16px);
    letter-spacing:.44em;
    color:rgba(233,199,102,.86);
  }

  h1.name{
    margin:0;
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    font-size:clamp(48px,13.5vw,92px);
    line-height:1.08;
    letter-spacing:.06em;
    background:linear-gradient(100deg,var(--gold-4) 0%,var(--gold-1) 22%,var(--gold-hi) 36%,var(--gold-2) 52%,var(--gold-1) 70%,var(--gold-3) 100%);
    background-size:260% 100%;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 22px rgba(233,199,102,.34));
    animation:shimmer 8s linear infinite;
  }
  @keyframes shimmer{to{background-position:260% 0}}

  .sub{
    margin:10px 0 0;
    font-family:"Noto Serif TC",serif;
    font-weight:300;
    font-size:clamp(16px,4vw,22px);
    letter-spacing:.18em;
    color:rgba(246,236,212,.86);
  }

  .rule{
    width:76px;height:1px;margin:26px auto 22px;
    background:linear-gradient(90deg,transparent,var(--gold-2),transparent);
    position:relative;
  }
  .rule::after{
    content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;
    transform:translate(-50%,-50%) rotate(45deg);
    background:var(--gold-1);box-shadow:0 0 10px rgba(244,223,154,.85);
  }

  .wish{
    margin:0;
    font-size:clamp(19px,5.2vw,29px);
    font-weight:500;
    letter-spacing:.15em;
    line-height:1.72;
    color:var(--gold-hi);
    text-shadow:0 0 24px rgba(233,199,102,.26);
  }
  .sig{
    margin:26px 0 0;
    font-size:clamp(12px,3vw,14px);
    letter-spacing:.3em;
    color:rgba(233,199,102,.55);
  }

  .share{
    position:relative;z-index:4;
    margin-top:clamp(16px,3.4vw,24px);
    display:inline-flex;align-items:center;gap:9px;
    min-height:44px;padding:11px 22px;
    font-family:"Noto Serif TC",serif;
    font-size:14px;letter-spacing:.18em;
    color:rgba(244,223,154,.92);
    background:rgba(233,199,102,.07);
    border:1px solid rgba(233,199,102,.34);
    border-radius:999px;
    cursor:pointer;
    transition:background .25s,border-color .25s,transform .15s;
  }
  .share:hover{background:rgba(233,199,102,.14);border-color:rgba(244,223,154,.6)}
  .share:active{transform:scale(.97)}
  .share svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .toast{
    position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,14px);
    z-index:9;padding:10px 20px;border-radius:999px;
    background:rgba(12,16,26,.92);border:1px solid rgba(233,199,102,.4);
    color:var(--gold-hi);font-size:13px;letter-spacing:.12em;
    opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* ---------- panels below the hero ---------- */
  .more{
    position:relative;z-index:3;
    width:min(92vw,760px);
    margin:0 auto;
    padding:0 0 96px;
    display:flex;flex-direction:column;gap:clamp(18px,3vw,26px);
  }
  .panel{
    position:relative;
    padding:clamp(22px,4vw,34px) clamp(18px,4vw,34px);
    border:1px solid rgba(233,199,102,.24);
    border-radius:18px;
    background:linear-gradient(180deg, rgba(12,16,26,.42), rgba(5,7,12,.62));
    backdrop-filter:blur(3px) saturate(112%);
    -webkit-backdrop-filter:blur(3px) saturate(112%);
    text-align:center;
    opacity:0;transform:translateY(22px);
    transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.25,1);
  }
  .panel.in{opacity:1;transform:none}
  .panel h2{
    margin:0 0 6px;
    font-family:"Noto Serif TC",serif;font-weight:500;
    font-size:clamp(19px,3.6vw,25px);letter-spacing:.12em;
    color:var(--gold-hi);
  }
  .panel .hint{
    margin:0 auto 22px;max-width:44ch;
    font-size:clamp(12.5px,2.2vw,14px);line-height:1.8;letter-spacing:.06em;
    color:rgba(246,236,212,.62);
  }

  /* wish balloons */
  .balloon-field{
    display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:flex-end;
  }
  .wballoon{
    position:relative;width:104px;height:126px;
    border:0;background:none;padding:0;cursor:pointer;
    display:grid;place-items:center;font-family:inherit;
  }
  .wballoon .body{
    position:relative;
    width:104px;height:126px;border-radius:50% 50% 46% 46%;
    background:radial-gradient(circle at 34% 26%, rgba(255,255,255,.34), transparent 55%), var(--bc,var(--gold-2));
    box-shadow:inset -12px -16px 26px rgba(0,0,0,.24), 0 14px 30px rgba(0,0,0,.34);
    display:grid;place-items:center;padding:14px;
    transition:transform .25s cubic-bezier(.2,.9,.25,1);
    animation:floatBob 4.6s ease-in-out infinite;
  }
  @keyframes floatBob{
    0%,100%{transform:translateY(0) rotate(-2deg)}
    50%    {transform:translateY(-11px) rotate(2deg)}
  }
  .wballoon:hover .body{transform:scale(1.06)}
  .wballoon .body::after{
    content:"";position:absolute;bottom:-9px;left:50%;margin-left:-5px;
    border:5px solid transparent;border-top-color:var(--bc,var(--gold-2));
  }
  .wballoon .string{
    position:absolute;bottom:-56px;left:50%;width:1.5px;height:56px;
    background:rgba(244,223,154,.35);transform:translateX(-50%);
  }
  .wballoon .w{
    font-size:12.5px;line-height:1.5;text-align:center;
    color:#241a06;font-weight:600;
  }
  .wballoon.pop{animation:pop .45s ease forwards}
  @keyframes pop{
    0%  {transform:scale(1)}
    35% {transform:scale(1.2)}
    100%{transform:scale(0);opacity:0}
  }

  /* wish tree lanterns */
  .lanterns{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;
  }
  .lantern{
    position:relative;
    padding:13px 10px;
    border-radius:14px;
    border:1px solid rgba(233,199,102,.22);
    background:rgba(233,199,102,.05);
    cursor:pointer;
    font-family:inherit;font-size:12.5px;line-height:1.55;letter-spacing:.05em;
    color:rgba(246,236,212,.55);
    opacity:.5;
    transition:opacity .5s ease,transform .3s ease,background .3s ease,border-color .3s ease;
    animation:sway 3.8s ease-in-out infinite;
  }
  .lantern:nth-child(2n){animation-delay:-.9s}
  .lantern:nth-child(3n){animation-delay:-1.7s}
  @keyframes sway{
    0%,100%{transform:rotate(-2.4deg)}
    50%    {transform:rotate(2.4deg)}
  }
  .lantern.lit{
    opacity:1;color:var(--gold-hi);
    background:linear-gradient(160deg, rgba(233,199,102,.28), rgba(244,223,154,.10));
    border-color:rgba(244,223,154,.6);
    box-shadow:0 0 26px rgba(233,199,102,.26);
    transform:translateY(-3px);
  }
  .lantern::after{
    content:"";position:absolute;left:50%;top:-13px;width:1px;height:13px;
    background:rgba(244,223,154,.3);transform:translateX(-50%);
  }

  /* inputs */
  .field{
    display:block;width:100%;
    padding:13px 15px;
    font-family:"Noto Serif TC",serif;font-size:14.5px;line-height:1.75;
    color:var(--ink);
    background:rgba(233,199,102,.06);
    border:1px solid rgba(233,199,102,.24);
    border-radius:12px;outline:none;resize:vertical;
    transition:border-color .2s ease,background .2s ease;
  }
  .field:focus{border-color:rgba(244,223,154,.55);background:rgba(233,199,102,.10)}
  .field::placeholder{color:rgba(246,236,212,.35)}

  .note{
    margin:12px 0 0;font-size:12.5px;letter-spacing:.06em;
    color:rgba(246,236,212,.55);min-height:1.3em;
  }

  .fireworks-btn{
    position:relative;z-index:4;
    padding:13px 30px;
    font-family:"Noto Serif TC",serif;font-size:14.5px;letter-spacing:.2em;
    color:#241a06;border:0;border-radius:999px;cursor:pointer;
    background:linear-gradient(100deg,var(--gold-2),var(--gold-1) 60%,var(--gold-hi));
    box-shadow:0 12px 30px rgba(0,0,0,.45);
    transition:transform .18s ease,box-shadow .18s ease;
  }
  .fireworks-btn:hover{transform:translateY(-2px) scale(1.03)}
  .fireworks-btn:active{transform:translateY(0) scale(.98)}

  .foot{
    position:relative;z-index:3;
    margin:clamp(20px,4vw,34px) auto 0;padding:0 18px;
    text-align:center;font-size:11px;letter-spacing:.24em;line-height:2;
    color:rgba(233,199,102,.34);
  }
  @media (max-height:560px){
    .card{padding-top:22px;padding-bottom:20px}
    .rule{margin:16px auto 14px}
    .sig{margin-top:14px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .panel{opacity:1;transform:none}
  }
</style>
</head>
<body>

<canvas id="sky"></canvas>
<div class="veil"></div>
<div class="grain"></div>
<canvas id="fx"></canvas>

<div class="chips">
  <button class="chip" id="musicBtn" type="button" aria-pressed="false"><span id="musicIco">♪</span><span>音樂</span></button>
  <button class="chip" id="fxBtn" type="button" aria-pressed="true"><span>特效</span></button>
</div>

<div class="stage">

  <div class="hero">
  <main class="card">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>

    <p class="eyebrow">生日快樂</p>
    <h1 class="name">老婆仔</h1>
    <p class="sub">畀我嘅親愛老婆</p>

    <div class="rule"></div>

    <p class="wish">身體健康，屋企人錫我</p>

    <p class="sig">永遠愛你</p>
  </main>

  <button class="share" id="share" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 15V3"/><path d="m8 7 4-4 4 4"/></svg>
    分享
  </button>
  </div>

  <!-- ================= extra panels ================= -->
  <div class="more" id="more">

    <!-- wish balloons -->
    <section class="panel" id="balloonPanel">
      <h2>許願氣球</h2>
      <p class="hint">每隻氣球入面有一句想同你講嘅說話。撳一下，佢就會爆開。</p>
      <div class="balloon-field" id="balloonField"></div>
      <p class="note" id="balloonNote"></p>
    </section>

    <!-- wish tree -->
    <section class="panel" id="treePanel">
      <h2>許願樹</h2>
      <p class="hint">一盞一盞撳著佢，每盞燈籠都係一個可以喺腦入面答嘅問題。</p>
      <div class="lanterns" id="lanterns"></div>
    </section>

    <!-- fireworks -->
    <section class="panel" id="finalePanel">
      <h2>最後一件事</h2>
      <p class="hint">撳一下，送多一場流星煙花。</p>
      <button class="fireworks-btn" id="finaleBtn" type="button">
        <span>放煙花</span> ✦
      </button>
    </section>

  </div>

  <p class="foot">✦ 冇廣告、冇追蹤、冇上傳任何嘢</p>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  /* ============================================================
     Settings — everything editable sits here
     ============================================================ */
  var SETTINGS = {
    wishMessages: [
      '願望已送出 ✦','宇宙收到你嘅願望…','啲蠟燭著咗 🎂','祝你今年乜都順順利利 ✨','再撳一次，多一個願望 🌟'
    ],
    balloonWishes: [
      '你一直照顧人，而家輪到大家照顧你',
      '辛苦晒，記得抖下先再繼續捱',
      '你值得所有好嘅事，唔止生日嗰日',
      '唔使做咗完美先值得被愛',
      '同你講聲：做得好好哋，你真係好叻',
      '今年唔求快，只求穩',
      '願你身體健康，其他唔使太執著',
      '多啲笑聲，少啲擔心',
      '你嘅耐性，係你最厲害嘅武器',
      '慢慢嚟，你已經做得好緊要',
      '希望你今日可以早啲瞓',
      '有人記住你今日生日，就係最靚嘅禮物'
    ],
    lanternWishes: [
      '今年想完成嘅事',
      '最想感謝嘅人',
      '最想改變嘅習慣',
      '最想去嘅地方',
      '最想學嘅新嘢',
      '最想放低嘅負擔',
      '最想留低嘅回憶',
      '最想對自己講嘅說話',
      '最想保護嘅人',
      '最想做到嘅事',
      '最想放鬆嘅一刻',
      '最想相信嘅自己'
    ]
  };

  var fxOn = true;
  var $ = function(s){ return document.querySelector(s); };
  var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };

  function storeGet(k, fb){
    try{ var v = localStorage.getItem(k); return v === null ? fb : JSON.parse(v); }
    catch(e){ return fb; }
  }
  function storeSet(k, v){
    try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){}
  }

  /* ============================================================
     Sky: stars, dust, meteors  (unchanged look)
     ============================================================ */
  var cv=document.getElementById('sky'), ctx=cv.getContext('2d');
  var W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
  var stars=[], dust=[], meteors=[], nextMeteor=0, last=0;
  var reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

  function size(){
    W=window.innerWidth; H=window.innerHeight;
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  function makeStars(n){
    for(var i=0;i<n;i++){
      stars.push({
        x:Math.random()*W, y:Math.random()*H,
        r:Math.random()*1.15+.28,
        a:Math.random()*.6+.25,
        tw:Math.random()*1.6+.5,
        ph:Math.random()*Math.PI*2,
        warm:Math.random()<.22
      });
    }
  }
  function makeDust(n){
    for(var i=0;i<n;i++){
      dust.push({
        x:Math.random()*W, y:Math.random()*H,
        r:Math.random()*1.5+.5,
        vy:-(Math.random()*.16+.04),
        drift:(Math.random()-.5)*.12,
        a:Math.random()*.30+.08,
        ph:Math.random()*Math.PI*2
      });
    }
  }
  function build(){
    size();
    var density=Math.round((W*H)/(9000));
    stars=[];dust=[];
    makeStars(Math.min(340,Math.max(90,density)));
    makeDust(Math.min(46,Math.max(14,Math.round(density*.12))));
  }

  function spawnMeteor(){
    var fromLeft=Math.random()<.72;
    var x=fromLeft? Math.random()*W*.86 : W*(0.14+Math.random()*.30);
    var y=-H*.16+Math.random()*H*.42;
    var ang=(fromLeft? 0.42: 2.24) + (Math.random()-.5)*.30;
    var sp=7.5+Math.random()*6.5;
    meteors.push({
      x:x,y:y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,
      len:120+Math.random()*130,
      life:0,max:78+Math.random()*40,
      hue:Math.random()<.35?'cool':'warm'
    });
  }

  function drawStar(s,t){
    var tw=0.62+0.38*Math.sin(t*s.tw+s.ph);
    var a=s.a*tw;
    ctx.beginPath();
    ctx.fillStyle=s.warm
      ? 'rgba(255,246,216,'+a.toFixed(3)+')'
      : 'rgba(214,228,255,'+a.toFixed(3)+')';
    ctx.arc(s.x,s.y,s.r,0,6.2832);
    ctx.fill();
    if(s.r>1.02){
      ctx.globalAlpha=a*.30;
      ctx.beginPath();
      ctx.fillStyle='#fff6d8';
      ctx.arc(s.x,s.y,s.r*3.1,0,6.2832);
      ctx.fill();
      ctx.globalAlpha=1;
    }
  }
  function drawDust(d,t){
    d.y+=d.vy; d.x+=d.drift;
    if(d.y<-6){d.y=H+6;d.x=Math.random()*W;}
    if(d.x<-6)d.x=W+6; if(d.x>W+6)d.x=-6;
    var a=d.a*(0.55+0.45*Math.sin(t*.9+d.ph));
    ctx.beginPath();
    ctx.fillStyle='rgba(244,223,154,'+Math.max(0,a).toFixed(3)+')';
    ctx.arc(d.x,d.y,d.r,0,6.2832);
    ctx.fill();
  }
  function drawMeteor(m){
    var p=m.life/m.max;
    var fade=p<.18? p/.18 : (p>.72? (1-p)/.28 : 1);
    fade=Math.max(0,Math.min(1,fade));
    var tx=m.x-m.vx*(m.len/9), ty=m.y-m.vy*(m.len/9);
    var g=ctx.createLinearGradient(m.x,m.y,tx,ty);
    if(m.hue==='cool'){
      g.addColorStop(0,'rgba(255,255,255,'+(fade*.98)+')');
      g.addColorStop(.28,'rgba(200,230,255,'+(fade*.62)+')');
      g.addColorStop(1,'rgba(190,225,255,0)');
    }else{
      g.addColorStop(0,'rgba(255,253,245,'+(fade*.99)+')');
      g.addColorStop(.26,'rgba(255,228,158,'+(fade*.70)+')');
      g.addColorStop(1,'rgba(233,199,102,0)');
    }
    ctx.strokeStyle=g;
    ctx.lineCap='round';
    ctx.lineWidth=2.4;
    ctx.beginPath();
    ctx.moveTo(m.x,m.y);
    ctx.lineTo(tx,ty);
    ctx.stroke();

    var hl=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,30);
    hl.addColorStop(0,'rgba(255,255,255,'+(fade*.92)+')');
    hl.addColorStop(.4,'rgba(255,240,200,'+(fade*.35)+')');
    hl.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=hl;
    ctx.beginPath();ctx.arc(m.x,m.y,30,0,6.2832);ctx.fill();
  }

  function frame(ts){
    if(!last)last=ts;
    var dt=Math.min(3,(ts-last)/16.67); last=ts;
    var t=ts/1000;

    ctx.clearRect(0,0,W,H);
    var bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,getComputedStyle(document.body).getPropertyValue('--night-1'));
    bg.addColorStop(.55,'#0a0f1b');
    bg.addColorStop(1,'#141b2b');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

    for(var i=0;i<stars.length;i++) drawStar(stars[i],t);
    for(var j=0;j<dust.length;j++) drawDust(dust[j],t);

    if(!reduced){
      nextMeteor-=dt;
      if(nextMeteor<=0){
        spawnMeteor();
        nextMeteor=45+Math.random()*95;
      }
      for(var k=meteors.length-1;k>=0;k--){
        var m=meteors[k];
        m.x+=m.vx*dt; m.y+=m.vy*dt; m.life+=dt;
        drawMeteor(m);
        if(m.life>m.max||m.x<-220||m.x>W+220||m.y>H+140) meteors.splice(k,1);
      }
    }else if(meteors.length===0 && t>1){
      spawnMeteor();
      meteors[0].life=meteors[0].max*0.32;
      meteors[0].x=W*.34; meteors[0].y=H*.16;
      meteors[0].vx=7; meteors[0].vy=3.4;
    }
    requestAnimationFrame(frame);
  }

  build();
  nextMeteor=8;
  requestAnimationFrame(frame);

  var rt;
  window.addEventListener('resize',function(){
    clearTimeout(rt);
    rt=setTimeout(build,160);
  });

  /* ============================================================
     FX overlay: confetti + fireworks
     ============================================================ */
  var fxv=document.getElementById('fx'), fctx=fxv.getContext('2d');
  var parts=[], fraf=null;
  var PALETTE=['#f4df9a','#e9c766','#fff6d8','#c99b3c','#ffffff','#d9c8ff'];

  function fxSize(){
    fxv.width=Math.round(W*DPR); fxv.height=Math.round(H*DPR);
    fxv.style.width=W+'px'; fxv.style.height=H+'px';
    fctx.setTransform(DPR,0,0,DPR,0,0);
  }
  function fxConfetti(count, power){
    if(!fxOn) return;
    for(var i=0;i<count;i++){
      parts.push({
        kind:'c',
        x:W/2+(Math.random()-0.5)*140,
        y:H*0.44,
        vx:(Math.random()-0.5)*15*power,
        vy:(Math.random()-0.92)*17*power,
        s:5+Math.random()*7,
        r:Math.random()*Math.PI,
        vr:(Math.random()-0.5)*0.3,
        c:PALETTE[(Math.random()*PALETTE.length)|0],
        life:1
      });
    }
    fxStart();
  }
  function fxFireworks(rounds){
    if(!fxOn) return;
    for(var r=0;r<rounds;r++){
      (function(r){
        setTimeout(function(){
          var cx=W*(0.18+Math.random()*0.64);
          var cy=H*(0.14+Math.random()*0.38);
          var col=PALETTE[(Math.random()*PALETTE.length)|0];
          var n=44+((Math.random()*26)|0);
          for(var i=0;i<n;i++){
            var a=(Math.PI*2*i)/n+Math.random()*.1;
            var sp=4+Math.random()*6;
            parts.push({
              kind:'s', x:cx, y:cy,
              vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
              s:2.2+Math.random()*2.6, r:0, vr:0,
              c:col, life:1
            });
          }
          fxStart();
        }, r*420);
      })(r);
    }
  }
  function fxStart(){ if(!fraf) fraf=requestAnimationFrame(fxTick); }
  function fxTick(){
    fctx.clearRect(0,0,W,H);
    parts=parts.filter(function(p){ return p.life>0 && p.y<H+80 && p.y>-80; });
    for(var i=0;i<parts.length;i++){
      var p=parts[i];
      p.vy += p.kind==='s' ? 0.11 : 0.32;
      p.vx *= p.kind==='s' ? 0.985 : 0.995;
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      p.life -= p.kind==='s' ? 0.014 : 0.006;
      fctx.save();
      fctx.translate(p.x,p.y);
      fctx.globalAlpha=Math.max(p.life,0);
      fctx.fillStyle=p.c;
      if(p.kind==='s'){
        fctx.beginPath();
        fctx.arc(0,0,p.s*Math.max(p.life,0.2),0,6.2832);
        fctx.fill();
      }else{
        fctx.rotate(p.r);
        fctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);
      }
      fctx.restore();
    }
    fraf=parts.length ? requestAnimationFrame(fxTick) : null;
  }
  fxSize();
  window.addEventListener('resize',fxSize);

  /* ============================================================
     Music — "Happy Birthday" synthesised, no audio file
     ============================================================ */
  var musicCtx=null, musicOn=false, musicTimer=null, musicStep=0;
  var MELODY=[
    261.63,261.63,293.66,261.63,349.23,329.63,
    261.63,261.63,293.66,261.63,392.0,349.23,
    261.63,261.63,523.25,440.0,349.23,329.63,
    293.66,293.66,329.63,293.66,392.0,349.23,
    523.25,440.0,349.23,329.63,293.66
  ];
  function musicEnsure(){
    if(!musicCtx){
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return false;
      musicCtx=new AC();
    }
    if(musicCtx.state==='suspended') musicCtx.resume();
    return true;
  }
  function musicNote(freq,dur,at){
    var o=musicCtx.createOscillator(), g=musicCtx.createGain();
    o.type='triangle'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,at);
    g.gain.exponentialRampToValueAtTime(0.15,at+0.04);
    g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
    o.connect(g); g.connect(musicCtx.destination);
    o.start(at); o.stop(at+dur+0.05);
  }
  function musicSchedule(){
    var beat=0.42, now=musicCtx.currentTime+0.05;
    for(var i=0;i<4;i++){
      var idx=(musicStep+i)%MELODY.length;
      musicNote(MELODY[idx],beat*0.9,now+i*beat);
    }
    musicStep=(musicStep+4)%MELODY.length;
    musicTimer=setTimeout(musicSchedule,beat*1000);
  }
  function musicToggle(){
    if(!musicEnsure()) return false;
    if(musicOn){ clearTimeout(musicTimer); musicOn=false; }
    else { musicOn=true; musicSchedule(); }
    return musicOn;
  }

  /* ============================================================
     Wish balloons
     ============================================================ */
  var GOLD_BALLOONS=['#f4df9a','#e9c766','#fff6d8','#c99b3c','#f0d9a8','#dcc07a'];
  function buildBalloons(){
    var host=$('#balloonField');
    host.innerHTML='';
    var wishes=SETTINGS.balloonWishes.slice();
    wishes.sort(function(){return Math.random()-0.5;});
    wishes.forEach(function(w,i){
      var b=document.createElement('button');
      b.className='wballoon'; b.type='button';
      b.style.setProperty('--bc',GOLD_BALLOONS[i%GOLD_BALLOONS.length]);
      b.innerHTML='<span class="body"><span class="w"></span></span><span class="string"></span>';
      b.querySelector('.w').textContent=w;
      b.addEventListener('click',function(){
        if(b.classList.contains('pop')) return;
        b.classList.add('pop');
        fxConfetti(58,0.7);
        var n=$('#balloonNote');
        n.textContent=w;
        n.style.opacity=0;
        (function(el){ requestAnimationFrame(function(){ el.style.transition='opacity .4s ease'; el.style.opacity=1; }); })(n);
        setTimeout(function(){ b.classList.remove('pop'); },500);
      });
      host.appendChild(b);
    });
  }

  /* ============================================================
     Wish tree lanterns
     ============================================================ */
  function buildLanterns(){
    var host=$('#lanterns');
    host.innerHTML='';
    var wishes=SETTINGS.lanternWishes.slice();
    wishes.sort(function(){return Math.random()-0.5;});
    wishes.forEach(function(w){
      var l=document.createElement('button');
      l.className='lantern'; l.type='button'; l.textContent=w;
      l.addEventListener('click',function(){
        l.classList.toggle('lit');
        if(l.classList.contains('lit')) fxConfetti(24,0.4);
      });
      host.appendChild(l);
    });
  }

  /* ============================================================
     Hero wish button + fireworks finale
     ============================================================ */
  (function(){
    var btn=$('#share'), toast=$('#toast');
    function say(msg){
      toast.textContent=msg; toast.classList.add('on');
      setTimeout(function(){toast.classList.remove('on');},1900);
    }
    function copyLink(){
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(location.href)
          .then(function(){say('連結已複製');})
          .catch(function(){say(location.href);});
      }else say(location.href);
    }
    btn.addEventListener('click',function(){
      var data={title:'老婆仔 生日快樂',
                text:'身體健康，屋企人錫我',
                url:location.href};
      if(navigator.share){
        navigator.share(data).then(function(){say('已開啟分享');}).catch(function(e){
          if(e && e.name==='AbortError') return;
          copyLink();
        });
      }else copyLink();
    });

    var fin=$('#finaleBtn');
    fin.addEventListener('click',function(){ fxFireworks(6); });
  })();

  /* ============================================================
     Chips: music / effects
     ============================================================ */
  (function(){
    var mb=$('#musicBtn'), fb=$('#fxBtn');
    mb.addEventListener('click',function(){
      var on=musicToggle();
      mb.setAttribute('aria-pressed',String(on));
      $('#musicIco').textContent=on?'♫':'♪';
    });
    fb.addEventListener('click',function(){
      fxOn=!fxOn;
      fb.setAttribute('aria-pressed',String(fxOn));
    });
  })();

  /* ============================================================
     Reveal panels on scroll
     ============================================================ */
  (function(){
    var panels=$$('.panel');
    if('IntersectionObserver' in window){
      var io=new IntersectionObserver(function(entries){
        entries.forEach(function(e){
          if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
        });
      },{threshold:0.12});
      panels.forEach(function(p){ io.observe(p); });
    }else{
      panels.forEach(function(p){ p.classList.add('in'); });
    }
  })();

  buildBalloons();
  buildLanterns();

  setTimeout(function(){ fxConfetti(60,0.5); }, 1400);
})();
</script>
</body>
</html>
